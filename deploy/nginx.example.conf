# =============================================================================
# FPL Arena — Skarb Kibica | Nginx na DigitalOcean (Ubuntu)
# =============================================================================
# 1. Skopiuj do: /etc/nginx/sites-available/fpl-arena
# 2. ln -s /etc/nginx/sites-available/fpl-arena /etc/nginx/sites-enabled/
# 3. Dostosuj server_name i sciezke root (folder dist po npm run build)
# 4. sudo nginx -t && sudo systemctl reload nginx
# 5. Certbot: sudo certbot --nginx -d twoja-domena.pl
# =============================================================================

# Przekierowanie HTTP -> HTTPS (odkomentuj po certbot)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name twoja-domena.pl www.twoja-domena.pl;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name twoja-domena.pl www.twoja-domena.pl;

    # Upload herbów / formularze admina (PNG do 2 MB + zapas)
    client_max_body_size 10m;

    # SCIEZKA DO dist/ — caly wynik npm run build (index.html, assets/, soundtracks/, ZIP)
    root /var/www/fpl-arena-skarb-kibica/dist;
    index index.html;

    # --- MIME (WAV / ZIP) ---
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js;
        application/json                      json;
        image/png                             png;
        image/jpeg                            jpeg jpg;
        image/svg+xml                         svg;
        image/x-icon                          ico;
        font/woff2                            woff2;
        audio/wav                             wav;
        application/zip                       zip;
    }

    # --- Soundtrack: brak pliku = czyste 404, NIGDY index.html ---
    location /soundtracks/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff";
    }

    # Archiwum ZIP playlisty (sciezka dokladna z public/)
    location = /FPL-Arena-Soundtrack-Sezon-2025-26.zip {
        try_files $uri =404;
        add_header Content-Disposition 'attachment; filename="FPL-Arena-Soundtrack-Sezon-2025-26.zip"';
        add_header Cache-Control "public, max-age=86400";
        default_type application/zip;
    }

    # Kazdy inny WAV/ZIP poza SPA fallback
    location ~* \.(wav|zip)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff";
    }

    # Hashed assets Vite — dlugi cache
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Logo i JSON statyczne
    location /logo/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.json$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA — tylko trasy aplikacji (bez istniejacych plikow)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Opcjonalnie po SSL (certbot uzupelni listen 443 ssl):
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/twoja-domena.pl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/twoja-domena.pl/privkey.pem;
}
