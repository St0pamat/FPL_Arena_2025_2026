        const FPL_BOOTSTRAP_URL = "https://fantasy.premierleague.com/api/bootstrap-static/";
        const FPL_PHOTO_SIZES = [
            (code) => `https://resources.premierleague.com/premierleague/photos/players/250x250/p${code}.png`,
            (code) => `https://resources.premierleague.com/premierleague/photos/players/110x140/p${code}.png`,
            (code) => `https://resources.premierleague.com/premierleague25/photos/players/250x250/p${code}.png`
        ];

        const getPhotoCode = (elementId, photoField) => {
            if (photoField) {
                const code = String(photoField).replace(/\.jpg$/i, "").split("/").pop();
                if (code && /^\d+$/.test(code)) return code;
            }
            if (elementId) return String(elementId);
            return null;
        };

        const getPlayerPhotoUrl = (elementId, photoField, variantIndex = 0) => {
            const code = getPhotoCode(elementId, photoField);
            if (!code) return null;
            const builder = FPL_PHOTO_SIZES[variantIndex] || FPL_PHOTO_SIZES[0];
            return builder(code);
        };

        const mapDreamTeamPlayer = (player, fplPlayersById) => {
            const fpl = player.elementId ? fplPlayersById[player.elementId] : null;
            let fplMatch = fpl;
            if (!fplMatch && player.name) {
                const key = String(player.name).toLowerCase();
                fplMatch = Object.values(fplPlayersById).find(
                    (x) => x.web_name && x.web_name.toLowerCase() === key
                );
            }
            const elementId = player.elementId || fplMatch?.id || null;
            const photoField = fplMatch?.photo || null;
            return {
                ...player,
                elementId,
                displayName: player.name || fplMatch?.web_name || "Zawodnik",
                photoField,
                position: player.position || fplMatch?.element_type || 0
            };
        };

        const inferFormation = (players) => {
            let def = 0;
            let mid = 0;
            let fwd = 0;
            players.forEach((p) => {
                if (p.position === 2) def += 1;
                else if (p.position === 3) mid += 1;
                else if (p.position === 4) fwd += 1;
            });
            return `${def}-${mid}-${fwd}`;
        };

        const groupPlayersByPosition = (players) => {
            const rows = { 1: [], 2: [], 3: [], 4: [] };
            players.forEach((p) => {
                const key = p.position;
                if (rows[key]) rows[key].push(p);
            });
            [1, 2, 3, 4].forEach((k) => {
                rows[k].sort((a, b) => (a.pitchX || 0) - (b.pitchX || 0));
            });
            return rows;
        };

        /** Stały slot 60×104px — zmienia się tylko odstęp poziomy między slotami w rzędzie. */
        const PITCH_SLOT_WIDTH = 60;
        const PITCH_SLOT_GAP = { 1: 0, 2: 22, 3: 16, 4: 10, 5: 6 };

        const computeRowGap = (playerCount) => {
            const n = Math.max(1, Math.min(playerCount, 5));
            return PITCH_SLOT_GAP[n] ?? 6;
        };

        const rowLayoutStyle = (playerCount) => ({
            "--row-gap": `${computeRowGap(playerCount)}px`
        });

        const PlayerSlot = ({ player }) => {
            const [photoIndex, setPhotoIndex] = useState(0);
            const [failed, setFailed] = useState(false);
            const initials = (player.displayName || "?")
                .split(/[\s.]+/)
                .filter(Boolean)
                .slice(0, 2)
                .map((s) => s[0])
                .join("")
                .toUpperCase();

            const photoUrl = failed
                ? null
                : getPlayerPhotoUrl(player.elementId, player.photoField, photoIndex);

            const handleImgError = () => {
                if (photoIndex < FPL_PHOTO_SIZES.length - 1) {
                    setPhotoIndex((i) => i + 1);
                } else {
                    setFailed(true);
                }
            };

            return (
                <div className="player-slot">
                    <div className="player-slot__avatar">

                                alt=""
                                loading="lazy"

                        </div>
                    </div>
                </div>
            );
        };

        const PitchLineRow = ({ players, rowClass, label }) => {
            if (!players.length) return null;
            const layoutStyle = rowLayoutStyle(players.length);
            return (
                <div
                    className={`season-pitch__row ${rowClass}`}
                    style={layoutStyle}
                    aria-label={label}
                >
                    {players.map((p) => (
                        <PlayerSlot
                            key={`${p.elementId || p.displayName}-${rowClass}`}
                            player={p}
                        />
                    ))}
                </div>

        const TeamOfSeasonPitch = ({ dreamTeam, fplPlayersById }) => {
            const lineup = useMemo(() => {
                const raw = (dreamTeam || []).filter((p) => p.position >= 1 && p.position <= 4);
                return raw.map((p) => mapDreamTeamPlayer(p, fplPlayersById));
            }, [dreamTeam, fplPlayersById]);

            const formation = useMemo(() => inferFormation(lineup), [lineup]);
            const rows = useMemo(() => groupPlayersByPosition(lineup), [lineup]);

            >
                <span>{icon}</span>

            </button>
        );

        const WynikiView = ({ matchesByGw, loading }) => {
            const gwList = useMemo(() => {
                if (!matchesByGw?.length) return [];
                return [...matchesByGw]
                    .map((b) => Number(b.gw))
                    .filter((n) => Number.isFinite(n))
                    .sort((a, b) => a - b);
            }, [matchesByGw]);

            const [selectedGw, setSelectedGw] = useState(1);

            useEffect(() => {
                if (gwList.length && !gwList.includes(selectedGw)) {
                    setSelectedGw(gwList[0]);
                }
            }, [gwList, selectedGw]);

            const currentBlock = useMemo(
                () => matchesByGw.find((b) => Number(b.gw) === selectedGw),
                [matchesByGw, selectedGw]
            );

            const matches = currentBlock?.matches || [];
            const gwIndex = gwList.indexOf(selectedGw);
            const canPrev = gwIndex > 0;
            const canNext = gwIndex >= 0 && gwIndex < gwList.length - 1;

            const gwStats = useMemo(() => {
                if (!matches.length) return null;
                const scores = matches.flatMap((m) => [m.pointsA, m.pointsB]);
                const top = [...matches].sort(
                    (a, b) => Math.max(b.pointsA, b.pointsB) - Math.max(a.pointsA, a.pointsB)
                )[0];
                const topPts = top ? Math.max(top.pointsA, top.pointsB) : 0;
                const topTeam = top
                    ? (top.pointsA >= top.pointsB ? top.teamA : top.teamB)
                    : "";
                return {
                    totalPts: scores.reduce((s, n) => s + Number(n), 0),
                    topTeam,
                    topPts
                };
            }, [matches]);

            return (
                <div className="space-y-6 animate-fade-in w-full max-w-6xl mx-auto">
                    <div className="border-b border-slate-800 pb-4">
                        <h2 className="text-3xl font-athletic font-bold uppercase tracking-tight text-white flex items-center gap-3">
                            <div className="league-logo-wrap rounded-lg p-1.5">
                                <LeagueLogo size="sm" />
                            </div>
                            Wyniki kolejek
                        </h2>
                        <p className="text-slate-400 mt-1">Wszystkie mecze H2H FPL Arena — 10 spotkań na kolejkę, 38 tygodni sezonu.</p>
                    </div>

                    {loading ? (
                        <div className="glass-panel rounded-2xl border border-slate-800 p-8 text-center text-slate-400">
                            Ładowanie wyników…
                        </div>
                    ) : gwList.length === 0 ? (
                        <div className="glass-panel rounded-2xl border border-red-500/30 bg-red-950/20 p-6 text-red-300 text-sm">
                            Brak danych. Upewnij się, że plik <span className="font-mono">wyniki_meczy.json</span> leży obok strony HTML.
                        </div>
                    ) : (
                        <>
                            <div className="glass-panel rounded-2xl border border-slate-800 p-4 md:p-5 flex flex-col lg:flex-row gap-4 lg:items-center lg:justify-between">
                                <div className="flex items-center justify-center gap-3">
                                    <button
                                        type="button"
                                        disabled={!canPrev}
                                        onClick={() => canPrev && setSelectedGw(gwList[gwIndex - 1])}
                                        className="w-11 h-11 rounded-xl border border-slate-700 bg-slate-900/80 text-white font-bold disabled:opacity-30 disabled:cursor-not-allowed hover:bg-slate-800 hover:border-emerald-500/40 transition-all"
                                        aria-label="Poprzednia kolejka"
                                    >
                                        ←
                                    </button>
                                    <div className="text-center min-w-[140px]">
                                        <div className="text-[10px] uppercase tracking-widest text-slate-500 font-mono">Kolejka</div>
                                        <div className="text-4xl font-athletic font-bold text-emerald-400 leading-none">GW {selectedGw}</div>
                                    </div>
                                    <button
                                        type="button"
                                        disabled={!canNext}
                                        onClick={() => canNext && setSelectedGw(gwList[gwIndex + 1])}
                                        className="w-11 h-11 rounded-xl border border-slate-700 bg-slate-900/80 text-white font-bold disabled:opacity-30 disabled:cursor-not-allowed hover:bg-slate-800 hover:border-emerald-500/40 transition-all"
                                        aria-label="Następna kolejka"
                                    >
                                        →
                                    </button>
                                </div>

                                <div className="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
                                    <label className="text-[10px] uppercase tracking-widest text-slate-500 font-mono sm:sr-only">
                                        Wybierz kolejkę
                                    </label>
                                    <select
                                        value={selectedGw}
                                        onChange={(e) => setSelectedGw(Number(e.target.value))}
                                        className="flex-1 sm:min-w-[220px] bg-[#020617] border border-slate-700 text-white rounded-xl px-4 py-2.5 text-sm font-semibold focus:outline-none focus:border-emerald-500/50"
                                    >
                                        {gwList.map((g) => (
                                            <option key={g} value={g}>Kolejka {g}</option>
                                        ))}
                                    </select>
                                    <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto sm:max-w-md">
                                        {gwList.map((g) => (
                                            <button
                                                key={g}
                                                type="button"
                                                onClick={() => setSelectedGw(g)}
                                                className={`px-2 py-1 rounded-lg text-[11px] font-mono font-bold border transition-all ${
                                                    g === selectedGw
                                                        ? "bg-emerald-500 text-slate-950 border-emerald-400"
                                                        : "bg-slate-900/60 text-slate-400 border-slate-700 hover:border-slate-500"
                                                }`}
                                            >
                                                {g}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {gwStats && (
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <div className="glass-panel rounded-xl border border-slate-800 p-4 text-center">
                                        <div className="text-[10px] text-slate-500 uppercase font-mono">Mecze w kolejce</div>
                                        <div className="text-2xl font-athletic font-bold text-white mt-1">{matches.length}</div>
                                    </div>
                                    <div className="glass-panel rounded-xl border border-slate-800 p-4 text-center">
                                        <div className="text-[10px] text-slate-500 uppercase font-mono">Suma punktów FPL</div>
                                        <div className="text-2xl font-athletic font-bold text-emerald-400 mt-1">{gwStats.totalPts}</div>
                                    </div>
                                    <div className="glass-panel rounded-xl border border-slate-800 p-4 text-center">
                                        <div className="text-[10px] text-slate-500 uppercase font-mono">Najwyższy wynik</div>
                                        <div className="text-sm font-bold text-yellow-400 mt-1 truncate" title={gwStats.topTeam}>
                                            {gwStats.topTeam}
                                        </div>
                                        <div className="text-lg font-athletic font-bold text-white">{gwStats.topPts} pkt</div>
                                    </div>
                                </div>
                            )}

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {matches.map((m, idx) => {
                                    const playerA = TEAM_BY_NAME[m.teamA];
                                    const playerB = TEAM_BY_NAME[m.teamB];
                                    const ptsA = Number(m.pointsA);
                                    const ptsB = Number(m.pointsB);
                                    const outcomeA = getMatchOutcome(ptsA, ptsB);
                                    const outcomeB = outcomeA === "W" ? "L" : outcomeA === "L" ? "W" : "D";
                                    const winA = outcomeA === "W";
                                    const winB = outcomeB === "W";

                                    return (
                                        <div
                                            key={`${selectedGw}-${idx}-${m.teamA}-${m.teamB}`}
                                            className="glass-panel rounded-2xl border border-slate-800 p-4 md:p-5 hover:border-slate-600 transition-colors"
                                        >
                                            <div className="flex items-center justify-between gap-3">
                                                <div className={`flex-1 min-w-0 flex items-center gap-2 ${winA ? "opacity-100" : winB ? "opacity-75" : ""}`}>
                                                    <TeamCrest fplId={playerA?.id} size="sm" />
                                                    <div className="min-w-0">
                                                        <div className={`text-sm font-bold truncate ${winA ? "text-emerald-300" : "text-slate-200"}`}>{m.teamA}</div>
                                                        {playerA && <div className="text-[10px] text-slate-500 truncate">{playerA.manager}</div>}
                                                    </div>
                                                </div>
                                                <div className="shrink-0 text-center px-2 font-mono font-bold text-xl text-white whitespace-nowrap">
                                                    <span className={winA ? "text-emerald-400" : ""}>{ptsA}</span>
                                                    <span className="text-slate-600 mx-1">:</span>
                                                    <span className={winB ? "text-emerald-400" : ""}>{ptsB}</span>
                                                </div>
                                                <div className={`flex-1 min-w-0 flex items-center gap-2 justify-end text-right ${winB ? "opacity-100" : winA ? "opacity-75" : ""}`}>
                                                    <div className="min-w-0">
                                                        <div className={`text-sm font-bold truncate ${winB ? "text-emerald-300" : "text-slate-200"}`}>{m.teamB}</div>
                                                        {playerB && <div className="text-[10px] text-slate-500 truncate">{playerB.manager}</div>}
                                                    </div>
                                                    <TeamCrest fplId={playerB?.id} size="sm" />
                                                </div>
                                            </div>
                                            <div className="flex justify-center gap-2 mt-3">
                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${
                                                    outcomeA === "W" ? "text-emerald-400 border-emerald-500/40 bg-emerald-500/10" :
                                                    outcomeA === "L" ? "text-red-400 border-red-500/40 bg-red-500/10" :
                                                    "text-slate-400 border-slate-600 bg-slate-800/50"
                                                }`}>{m.teamA.split(" ")[0]}: {H2H_PL[outcomeA]}</span>
                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${
                                                    outcomeB === "W" ? "text-emerald-400 border-emerald-500/40 bg-emerald-500/10" :
                                                    outcomeB === "L" ? "text-red-400 border-red-500/40 bg-red-500/10" :
                                                    "text-slate-400 border-slate-600 bg-slate-800/50"
                                                }`}>{m.teamB.split(" ")[0]}: {H2H_PL[outcomeB]}</span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const emptyStandingRow = (team) => ({
            team,
            id: TEAM_BY_NAME[team]?.id || null,
            w: 0,
            d: 0,
            l: 0,
            pts: 0,
            score: 0
        });

        const miniLeagueStats = (teams, matchLog) => {
            const s = {};
            teams.forEach((t) => { s[t] = { pts: 0, score: 0 }; });
            matchLog.forEach((m) => {
                if (!teams.includes(m.teamA) || !teams.includes(m.teamB)) return;
                s[m.teamA].pts += m.leaguePtsA;
                s[m.teamB].pts += m.leaguePtsB;
                s[m.teamA].score += m.fa;
                s[m.teamB].score += m.fb;
            });
            return s;
        };

        const compareStandingRows = (a, b, matchLog) => {
            if (b.pts !== a.pts) return b.pts - a.pts;
            if (b.score !== a.score) return b.score - a.score;
            const mini = miniLeagueStats([a.team, b.team], matchLog);
            if (mini[b.team].pts !== mini[a.team].pts) return mini[b.team].pts - mini[a.team].pts;
            if (mini[b.team].score !== mini[a.team].score) return mini[b.team].score - mini[a.team].score;
            return a.team.localeCompare(b.team, "pl");
        };

        const computeStandingsAtGw = (matchesByGw, throughGw) => {
            const teamNames = PLAYERS_DATA.map((p) => p.team);
            const stats = {};
            teamNames.forEach((t) => { stats[t] = emptyStandingRow(t); });
            const matchLog = [];

            const sortedBlocks = [...matchesByGw].sort((a, b) => Number(a.gw) - Number(b.gw));
            for (const block of sortedBlocks) {
                const gw = Number(block.gw);
                if (gw > throughGw) break;
                for (const m of block.matches || []) {
                    const fa = Number(m.pointsA);
                    const fb = Number(m.pointsB);
                    let lpa;
                    let lpb;
                    if (fa > fb) {
                        lpa = 3;
                        lpb = 0;
                        stats[m.teamA].w += 1;
                        stats[m.teamB].l += 1;
                    } else if (fa < fb) {
                        lpa = 0;
                        lpb = 3;
                        stats[m.teamB].w += 1;
                        stats[m.teamA].l += 1;
                    } else {
                        lpa = 1;
                        lpb = 1;
                        stats[m.teamA].d += 1;
                        stats[m.teamB].d += 1;
                    }
                    stats[m.teamA].pts += lpa;
                    stats[m.teamB].pts += lpb;
                    stats[m.teamA].score += fa;
                    stats[m.teamB].score += fb;
                    matchLog.push({
                        teamA: m.teamA,
                        teamB: m.teamB,
                        leaguePtsA: lpa,
                        leaguePtsB: lpb,
                        fa,
                        fb
                    });
                }
            }

            const rows = teamNames.map((t) => ({ ...stats[t] }));
            rows.sort((a, b) => compareStandingRows(a, b, matchLog));
            rows.forEach((r, i) => { r.rank = i + 1; });
            return rows;
        };

        const buildStandingsHistory = (matchesByGw) => {
            if (!matchesByGw?.length) return { byGw: {}, gwList: [], maxGw: 38 };
            const gwList = [...matchesByGw]
                .map((b) => Number(b.gw))
                .filter((n) => Number.isFinite(n))
                .sort((a, b) => a - b);
            const maxGw = gwList[gwList.length - 1] || 38;
            const byGw = {};
            let prevRankByTeam = {};

            for (let gw = 1; gw <= maxGw; gw++) {
                if (!gwList.includes(gw)) continue;
                const rows = computeStandingsAtGw(matchesByGw, gw);
                rows.forEach((r) => {
                    if (gw === 1) {
                        r.rankChange = null;
                    } else {
                        const prev = prevRankByTeam[r.team];
                        r.rankChange = prev != null ? prev - r.rank : null;
                    }
                });
                prevRankByTeam = Object.fromEntries(rows.map((r) => [r.team, r.rank]));
                byGw[gw] = rows;
            }

            return { byGw, gwList, maxGw };
        };

        const RankChangeBadge = ({ change }) => {
            if (change == null) {
                return (
                    <span className="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-slate-800/80 text-slate-500 text-xs font-mono" title="Pierwsza kolejka — brak poprzedniej pozycji">
                        —
                    </span>
                );
            }
            if (change > 0) {
                return (
                    <span className="inline-flex flex-col items-center justify-center w-8 h-8 rounded-lg bg-emerald-500/15 border border-emerald-500/40 text-emerald-400" title={`Awans o ${change} ${change === 1 ? "miejsce" : "miejsca"}`}>
                        <span className="text-sm leading-none">▲</span>
                        <span className="text-[9px] font-bold font-mono">{change}</span>
                    </span>
                );
            }
            if (change < 0) {
                const drop = Math.abs(change);
                return (
                    <span className="inline-flex flex-col items-center justify-center w-8 h-8 rounded-lg bg-red-500/15 border border-red-500/40 text-red-400" title={`Spadek o ${drop} ${drop === 1 ? "miejsce" : "miejsc"}`}>
                        <span className="text-sm leading-none">▼</span>
                        <span className="text-[9px] font-bold font-mono">{drop}</span>
                    </span>
                );
            }
            return (
                <span className="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-slate-700/50 border border-slate-600 text-slate-400" title="Bez zmian względem poprzedniej kolejki">
                    <span className="text-base leading-none">▬</span>
                </span>
            );
        };

        const StandingsView = ({ matchesByGw, loading }) => {
            const standingsHistory = useMemo(
                () => buildStandingsHistory(matchesByGw),
                [matchesByGw]
            );
            const { byGw, gwList, maxGw } = standingsHistory;
            const [selectedGw, setSelectedGw] = useState(null);

            useEffect(() => {
                if (maxGw && selectedGw == null) {
                    setSelectedGw(maxGw);
                } else if (maxGw && selectedGw > maxGw) {
                    setSelectedGw(maxGw);
                }
            }, [maxGw, selectedGw]);

            const effectiveGw = selectedGw ?? maxGw;
            const rows = byGw[effectiveGw] || [];
            const gwIndex = gwList.indexOf(effectiveGw);
            const canPrev = gwIndex > 0;
            const canNext = gwIndex >= 0 && gwIndex < gwList.length - 1;
            const isFinal = effectiveGw === maxGw;

            return (
                <div className="space-y-6 animate-fade-in w-full max-w-6xl mx-auto">
                    <div className="border-b border-slate-800 pb-4">
                        <h2 className="text-3xl font-athletic font-bold uppercase tracking-tight text-white flex items-center gap-3">
                            <div className="league-logo-wrap rounded-lg p-1.5">
                                <LeagueLogo size="sm" />
                            </div>
                            {isFinal ? "Tabela końcowa FPL Arena" : `Tabela po kolejce ${effectiveGw}`}
                        </h2>
                        <p className="text-slate-400 mt-1 text-sm max-w-3xl">
                            Klasyfikacja H2H liczona z wyników meczów: <strong className="text-slate-300">pkt ligi</strong> (3/1/0),
                            przy remisie punktów — <strong className="text-slate-300">Score ogółem</strong>, potem <strong className="text-slate-300">bilans bezpośredni</strong>.
                            {isFinal ? " Domyślnie widok po 38. kolejce." : ""}
                        </p>
                    </div>

                    {loading ? (
                        <div className="glass-panel rounded-2xl border border-slate-800 p-8 text-center text-slate-400">
                            Ładowanie tabel…
                        </div>
                    ) : gwList.length === 0 ? (
                        <div className="glass-panel rounded-2xl border border-red-500/30 bg-red-950/20 p-6 text-red-300 text-sm">
                            Brak wyników meczowych — sprawdź plik <span className="font-mono">wyniki_meczy.json</span>.
                        </div>
                    ) : (
                        <>
                            <div className="glass-panel rounded-2xl border border-slate-800 p-4 md:p-5 flex flex-col lg:flex-row gap-4 lg:items-center lg:justify-between">
                                <div className="flex items-center justify-center gap-3">
                                    <button
                                        type="button"
                                        disabled={!canPrev}
                                        onClick={() => canPrev && setSelectedGw(gwList[gwIndex - 1])}
                                        className="w-11 h-11 rounded-xl border border-slate-700 bg-slate-900/80 text-white font-bold disabled:opacity-30 disabled:cursor-not-allowed hover:bg-slate-800 hover:border-emerald-500/40 transition-all"
                                        aria-label="Poprzednia kolejka"
                                    >
                                        ←
                                    </button>
                                    <div className="text-center min-w-[160px]">
                                        <div className="text-[10px] uppercase tracking-widest text-slate-500 font-mono">Stan tabeli</div>
                                        <div className="text-3xl font-athletic font-bold text-emerald-400 leading-none">
                                            {isFinal ? "Finał" : `GW ${effectiveGw}`}
                                        </div>
                                    </div>
                                    <button
                                        type="button"
                                        disabled={!canNext}
                                        onClick={() => canNext && setSelectedGw(gwList[gwIndex + 1])}
                                        className="w-11 h-11 rounded-xl border border-slate-700 bg-slate-900/80 text-white font-bold disabled:opacity-30 disabled:cursor-not-allowed hover:bg-slate-800 hover:border-emerald-500/40 transition-all"
                                        aria-label="Następna kolejka"
                                    >
                                        →
                                    </button>
                                </div>
                                <div className="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
                                    <select
                                        value={effectiveGw}
                                        onChange={(e) => setSelectedGw(Number(e.target.value))}
                                        className="flex-1 sm:min-w-[200px] bg-[#020617] border border-slate-700 text-white rounded-xl px-4 py-2.5 text-sm font-semibold focus:outline-none focus:border-emerald-500/50"
                                    >
                                        {gwList.map((g) => (
                                            <option key={g} value={g}>
                                                {g === maxGw ? `Kolejka ${g} (tabela końcowa)` : `Po kolejce ${g}`}
                                            </option>
                                        ))}
                                    </select>
                                    <button
                                        type="button"
                                        onClick={() => setSelectedGw(maxGw)}
                                        className={`px-4 py-2.5 rounded-xl text-sm font-semibold border transition-all ${
                                            isFinal
                                                ? "bg-emerald-500 text-slate-950 border-emerald-400"
                                                : "bg-slate-900 text-slate-300 border-slate-700 hover:border-emerald-500/40"
                                        }`}
                                    >
                                        Tabela końcowa
                                    </button>
                                </div>
                            </div>

                            <div className="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto">
                                {gwList.map((g) => (
                                    <button
                                        key={g}
                                        type="button"
                                        onClick={() => setSelectedGw(g)}
                                        className={`px-2 py-1 rounded-lg text-[11px] font-mono font-bold border transition-all ${
                                            g === effectiveGw
                                                ? "bg-emerald-500 text-slate-950 border-emerald-400"
                                                : "bg-slate-900/60 text-slate-400 border-slate-700 hover:border-slate-500"
                                        }`}
                                    >
                                        {g}
                                    </button>
                                ))}
                            </div>

                            <div className="overflow-x-auto rounded-2xl border border-slate-800 shadow-2xl glass-panel">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-slate-900/80 text-slate-400 font-mono uppercase text-xs border-b border-slate-800">
                                        <tr>
                                            <th className="p-4 font-semibold text-center w-14">Poz.</th>
                                            <th className="p-4 font-semibold text-center w-16" title="Zmiana vs poprzednia kolejka">Zm.</th>
                                            <th className="p-4 font-semibold">Menedżer & Klub</th>
                                            <th className="p-4 font-semibold text-center">Bilans (W-D-L)</th>
                                            <th className="p-4 font-semibold text-center text-white">Pkt H2H</th>
                                            <th className="p-4 font-semibold text-center text-emerald-400">Score ogółem</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800/50">
                                        {rows.map((r) => {
                                            const player = PLAYER_BY_ID[r.id] || {
                                                id: r.id,
                                                team: r.team,
                                                manager: TEAM_BY_NAME[r.team]?.manager || ""
                                            };
                                            const pos = r.rank;
                                            return (
                                                <tr key={r.team} className="hover:bg-slate-800/30 transition-colors">
                                                    <td className={`p-4 text-center font-athletic text-xl font-bold ${pos <= 3 ? "text-yellow-500" : pos >= 18 ? "text-red-500" : "text-slate-500"}`}>
                                                        {pos}
                                                    </td>
                                                    <td className="p-4 text-center">
                                                        <RankChangeBadge change={r.rankChange} />
                                                    </td>
                                                    <td className="p-4">
                                                        <TeamBrand player={player} crestSize="sm" />
                                                    </td>
                                                    <td className="p-4 text-center font-mono text-slate-400">
                                                        <span className="text-emerald-500">{r.w}</span>
                                                        {" - "}
                                                        <span className="text-slate-500">{r.d}</span>
                                                        {" - "}
                                                        <span className="text-red-500">{r.l}</span>
                                                    </td>
                                                    <td className="p-4 text-center font-bold text-white text-lg">{r.pts}</td>
                                                    <td className="p-4 text-center font-mono text-emerald-400">{r.score}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const parsePtsFromStat = (str) => {
            if (!str) return 0;
            const m = String(str).match(/([-+]?[\d.]+)/);
            return m ? parseFloat(m[1]) : 0;
        };

        const buildExtraHallAwards = (players, highlights) => {
            if (!highlights || Object.keys(highlights).length === 0) return [];

            const scan = {
                bestGw: { points: 0, gw: 0, id: 0 },
                maxBench: { val: 0, id: 0 },
                maxWinStreak: { val: 0, id: 0 },
                maxAvg: { val: 0, id: 0 },
                maxChipPts: { val: 0, id: 0 },
                bestChipWeek: { points: 0, id: 0, gw: 0, label: "" },
                bestTransfer: { rp: -999, id: 0, gw: 0, sold: "", bought: "" },
                worstTransfer: { rp: 999, id: 0, gw: 0, sold: "", bought: "" },
                maxExpOver: { val: 0, id: 0 },
                maxSpring: { trend: -999, id: 0 },
                minAutumn: { trend: 999, id: 0 },
                maxDraws: { val: 0, id: 0 },
                maxTopGain: { net: 0, id: 0, name: "" },
                minHits: { val: 999, id: 0 }
            };

            Object.entries(highlights).forEach(([idStr, data]) => {
                const id = Number(idStr);
                (data.gwPoints || []).forEach((g) => {
                    if (g.points > scan.bestGw.points) scan.bestGw = { points: g.points, gw: g.gw, id };
                });

            const [matchesLoading, setMatchesLoading] = useState(true);
            const [playerHighlights, setPlayerHighlights] = useState({});
            const [highlightsLoading, setHighlightsLoading] = useState(true);
            const [gladiatorOr, setGladiatorOr] = useState({});
            const [fplPlayersById, setFplPlayersById] = useState({});

            useEffect(() => {
                let isMounted = true;

                fetch(FPL_BOOTSTRAP_URL)
                    .then((res) => (res.ok ? res.json() : null))
                    .then((data) => {
                        if (!isMounted || !data?.elements) return;
                        const map = {};
                        data.elements.forEach((el) => {
                            map[el.id] = {
                                id: el.id,
                                web_name: el.web_name,
                                photo: el.photo,
                                element_type: el.element_type
                            };
                        });
                        setFplPlayersById(map);
                    })
                    .catch(() => {
                        if (isMounted) setFplPlayersById({});
                    });

                return () => { isMounted = false; };
            }, []);

            useEffect(() => {
                let isMounted = true;

                fetch("wyniki_meczy.json")
                    .then((res) => {
                        if (!res.ok) {
                            throw new Error("Nie udało się odczytać terminarza.");
                        }
                        return res.json();
                    })
                    .then((data) => {
                        if (isMounted && Array.isArray(data)) {
                            setMatchesByGw(data);
                        }
                    })
                    .catch(() => {
                        if (isMounted) {
                            setMatchesByGw([]);
                        }
                    })
                    .finally(() => {
                        if (isMounted) {
                            setMatchesLoading(false);
                        }
                    });

                return () => {
                    isMounted = false;
                };
            }, []);

            useEffect(() => {
                let isMounted = true;

                fetch("player_highlights.json")
                    .then((res) => (res.ok ? res.json() : {}))
                    .then((data) => {
                        if (isMounted && data && typeof data === "object") {
                            setPlayerHighlights(data);
                        }
                    })
                    .catch(() => {
                        if (isMounted) setPlayerHighlights({});
                    })
                    .finally(() => {
                        if (isMounted) setHighlightsLoading(false);
                    });

                return () => {
                    isMounted = false;
                };
            }, []);

            useEffect(() => {
                let isMounted = true;
                fetch("gladiator_or.json")
                    .then((res) => (res.ok ? res.json() : {}))
                    .then((data) => {
                        if (isMounted && data && typeof data === "object") {
                            setGladiatorOr(data);
                        }
                    })
                    .catch(() => {
                        if (isMounted) setGladiatorOr({});
                    });
                return () => { isMounted = false; };
            }, []);

            const currentPlayer = useMemo(() => {
                return players.find(p => p.id === selectedPlayerId);
            }, [players, selectedPlayerId]);

            const currentHighlights = useMemo(() => {
                return playerHighlights[String(selectedPlayerId)] || null;
            }, [playerHighlights, selectedPlayerId]);

            const predictedStandings = useMemo(
                () => buildPredictedStandings(players, gladiatorOr),
                [players, gladiatorOr]
            );

                if (!currentPlayer) return { historicalOr: null, historicalOrSeason: null, seasonOr: null };
                return getPlayerOrBundle(currentPlayer.id, gladiatorOr, currentHighlights);
            }, [currentPlayer, gladiatorOr, currentHighlights]);

                                                    ) : playerSchedule.length === 0 ? (
                                                        <div className="text-sm text-red-300 bg-red-950/20 rounded-xl border border-red-500/30 p-4">
                                                            Brak danych meczowych. Sprawdź, czy plik <span className="font-mono">wyniki_meczy.json</span> jest obok strony i zawiera wyniki.
                                                        </div>
                                                    ) : (
                                                        <div className="max-h-[360px] overflow-y-auto pr-1 space-y-2">
                                                            {playerSchedule.map((match) => (
                                                                <div key={`${currentPlayer.id}-${match.gw}`} className="bg-[#020617] border border-slate-800 rounded-xl p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                                                    <div className="min-w-0 flex-1">
                                                                        <div className="text-[11px] text-slate-500 font-mono uppercase mb-2">GW {match.gw} • {match.isHome ? "Dom" : "Wyjazd"}</div>
                                                                        <div className="flex items-center gap-2 min-w-0">
                                                                            <TeamCrest fplId={currentPlayer.id} size="xs" />
                                                                            <span className="text-xs text-slate-300 truncate max-w-[28%] sm:max-w-[32%]" title={currentPlayer.team}>{currentPlayer.team}</span>
                                                                            <span className="text-sm font-mono font-bold text-white px-1.5 shrink-0">{match.goalsFor}:{match.goalsAgainst}</span>
                                                                            <span className="text-xs text-slate-300 truncate max-w-[28%] sm:max-w-[32%] text-right" title={match.opponent}>{match.opponent}</span>
                                                                            <TeamCrest fplId={match.opponentId} size="xs" />
                                                                        </div>
                                                                    </div>
                                                                    <div className="flex items-center gap-2 shrink-0 self-end sm:self-center">
                                                                        <span className={`text-[11px] font-bold px-2.5 py-1 rounded-md border ${match.outcome === "W" ? "text-emerald-400 border-emerald-500/30 bg-emerald-500/10" : match.outcome === "D" ? "text-slate-300 border-slate-500/30 bg-slate-500/10" : "text-red-400 border-red-500/30 bg-red-500/10"}`}>
                                                                            {match.outcome}
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>

                                            </div>
                                        </div>

                                        {!highlightsLoading && (
                                            <SeasonHighlightsPanel
                                                highlights={currentHighlights}
                                                fplPlayersById={fplPlayersById}
                                            />
                                        )}

                                    </div>
                                )}
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
